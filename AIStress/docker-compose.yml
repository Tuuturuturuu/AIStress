services:
  db:
    image: postgres:17-alpine
    container_name: aistress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aistress
      POSTGRES_USER: aistress
      POSTGRES_PASSWORD: aistress_dev
    ports:
      - "5432:5432"
    volumes:
      - aistress-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aistress -d aistress" ]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aistress-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aistress.com
      PGADMIN_DEFAULT_PASSWORD: admin_dev
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  aistress-postgres-data:
